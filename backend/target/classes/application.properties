spring.application.name=leadfinder-backend
server.port=8080

# SerpAPI key is required for actual LinkedIn candidate search
# Set this to your SerpAPI key: https://serpapi.com/
serpapi.api.key=23c8e73885dbc6ef04455cd90aff2a32bd9e546a62c287971dfca62282698e15

# Use in-memory H2 for local backend startup during development
spring.datasource.url=jdbc:h2:mem:leadfinder;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.jpa.show-sql=true
logging.level.com.leadfinder.client=DEBUG

# NinjaPear API key for profile enrichment (Proxycurl has been sunset)
# Get a free key at: https://nubela.co/
proxycurl.api.key=5d62be9e29ac4ee0986f50e19fd7f5bd
# NinjaPear API endpoint (default) that expects work_email or first_name+employer_website
proxycurl.api.url=https://nubela.co/api/v1/employee/profile
# Optional fallback API URL to try if primary provider doesn't return data
proxycurl.fallback.api.url=